[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wessley-schematic"
version = "0.1.0"
description = "Automotive Wiring Diagram Synthetic Data & Parsing for Wessley AI"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Wessley AI Team", email = "sahar@wessley.ai"}
]
keywords = ["automotive", "wiring", "schematic", "synthetic-data", "machine-learning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "pydantic>=2.0.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]
png = [
    "cairosvg>=2.7.0",
]
ml = [
    "ultralytics>=8.0.0",
    "opencv-python>=4.8.0",
    "cairosvg>=2.7.0",
]

[project.scripts]
wessley-schematic = "wessley_schematic.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/wessley_schematic"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
]

[tool.ruff.isort]
known-first-party = ["wessley_schematic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
